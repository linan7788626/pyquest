<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PyQuest · NLI 素材预览</title>
  <link rel="icon" type="image/png" href="/nli-preview/ui_shard.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <!-- 教学正文用霞鹜文楷（简体原版，经 jsDelivr npm 分包引入，unicode-range 切片按需下载；
       快乐体 ZCOOL KuaiLe 退位为展示字体：logo / 章节名地名 / 胜利大标题 -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/lxgwwenkai-regular.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/lxgwwenkai-bold.css" />
  <style>
    :root {
      --panel: #fff8ea;
      --panel-border: #b98a4e;
      --ink: #4a3b32;
      --accent: #e86a6a;
      --gold: #ffd257;
      --teal: #3ddad7;
      --green: #57b34a;
      /* ---- 教学排版 token（#7）----
         字号收敛为 6 档；文楷栈负责长文阅读，加载失败回退系统楷体/宋体 */
      --fs-caption: 12px;
      --fs-body: 15px;
      --fs-body-lg: 17px;
      --fs-display: 21px;
      --fs-hero: 44px;
      --fs-logo: 64px;
      /* 大卡圆角：整页羊皮纸模态（世界地图 / 胜利封印页）共用骨架 */
      --r-lg: 18px;
      --font-kai: "LXGW WenKai", "Kaiti SC", "STKaiti", "KaiTi", "Songti SC", "SimSun", serif;
      /* ---- 竖屏画布外边距（#12）：竖屏时设计画布向上下扩展铺满视口，
         该变量 = 画布区域之外的设计坐标边距，由 main.js fitStage 写入，
         HUD / 提示 / 对话用它锚定画布边缘（横屏恒为 0） ---- */
      --cam-pad: 0px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background: #2c2438;
      font-family: "ZCOOL KuaiLe", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      overflow: hidden;
    }
    #wrap {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
    }
    #stage {
      position: relative;
      width: 960px; height: 640px;
      max-width: 100vw; max-height: 100vh;
      /* 保持 3:2，缩放由 JS 控制；无 JS 回退时 DOM UI 以 1:1 呈现 960×640 设计稿 */
    }
    #stage > #game { position: absolute; inset: 0; }
    #stage > canvas { position: absolute; inset: 0; }
    #stage canvas { image-rendering: auto; }

    /* ---------- DOM UI 层（覆盖在画布上）· #12 移动端断裂修复 ----------
       两层分工：
       · #ui —— 视觉坐标系（不缩放，恒等于 stage 矩形）。碎片飞行 / 金光脉冲等
         以 getBoundingClientRect 计算视觉坐标的 JS 特效元素挂这层，所见即所得。
       · #ui-scale —— 960×640 设计坐标系（= canvas 1920×1280 内部尺寸的一半）。
         全部浮层 / 字号 / 间距在这里按设计尺寸排版，由 main.js fitStage 以
         「stage 宽 / 960」的系数（与画布同系数、同原点 = stage 左上角）整体
         transform: scale，随画布等比缩放——手机上 stage 压到 374×249 时
         浮层按比例同步缩小，不再溢出截断。 */
    #ui {
      position: absolute; inset: 0;
      pointer-events: none;
      z-index: 10;
    }
    #ui-scale {
      position: absolute; left: 0; top: 0;
      width: 960px; height: 640px;
      transform-origin: 0 0;
      pointer-events: none;
    }
    #ui-scale > * { pointer-events: auto; }

    /* HUD 顶部 */
    #hud-top {
      position: absolute; top: 10px; left: 12px; right: 12px;
      display: flex; align-items: flex-start; justify-content: space-between;
      pointer-events: none;
    }
    .hearts { display: flex; gap: 4px; }
    .hearts svg { width: 26px; height: 26px; filter: drop-shadow(0 2px 0 rgba(0,0,0,.35)); }
    .hud-stack {
      display: flex; flex-direction: column; align-items: flex-end; gap: 5px;
      pointer-events: none;
    }
    .hud-right {
      display: flex; align-items: center; gap: 10px;
      background: rgba(42, 32, 24, .72);
      border: 2px solid #6b4f2e; border-radius: 12px;
      padding: 6px 12px; color: #fff;
      font-size: var(--fs-body); letter-spacing: 1px;
      pointer-events: none;
    }
    .hud-right svg { width: 16px; height: 20px; }
    #shard-count.gain svg { animation: gainPop .45s ease-out; }
    @keyframes gainPop {
      0% { transform: scale(1); } 40% { transform: scale(1.7) rotate(-12deg); }
      100% { transform: scale(1); }
    }
    /* 扣心反馈：红闪 + 轻抖 150ms（HUD.js 在心数减少时挂类） */
    .hearts.hurt-flash { animation: hurtFlash .15s ease-out; }
    @keyframes hurtFlash {
      0% { filter: brightness(1); transform: translateX(0); }
      30% { filter: brightness(1.6) saturate(1.7) drop-shadow(0 0 6px rgba(232, 106, 106, .95)); transform: translateX(-3px); }
      60% { filter: brightness(1.25) drop-shadow(0 0 4px rgba(232, 106, 106, .55)); transform: translateX(2px); }
      100% { filter: brightness(1); transform: translateX(0); }
    }
    /* ---- 目标行（#11 HUD 解耦）：与碎片计数分层的独立信息。
       不占胶囊边框：胶囊下方悬挂的小金字行，文楷 15px，
       带 2px 深色底压住游戏画面，右缘与胶囊对齐（长文案向左展开） */
    #objective {
      font-family: var(--font-kai); font-size: var(--fs-body); line-height: 1.3;
      color: var(--gold); letter-spacing: .5px; white-space: nowrap;
      background: rgba(24, 16, 38, .72);
      padding: 2px 10px; border-radius: 8px;
      text-shadow: 0 1px 2px rgba(0, 0, 0, .55);
      pointer-events: none;
    }

    /* 提示条 */
    #hint {
      position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
      background: rgba(42, 32, 24, .72);
      border: 2px solid #6b4f2e; border-radius: 12px;
      color: #fff; font-family: var(--font-kai); font-size: var(--fs-body); letter-spacing: 1px;
      padding: 6px 14px; white-space: nowrap;
      pointer-events: none;
      transition: opacity .15s;
    }
    #hint b { color: var(--gold); }
    #hint.hidden { opacity: 0; }

    /* 按键帽 */
    kbd {
      display: inline-block; min-width: 18px; text-align: center;
      background: #fff; border: 2px solid #b98a4e; border-bottom-width: 3px;
      border-radius: 6px; padding: 0 6px; margin: 0 2px;
      font-size: var(--fs-caption); line-height: 18px; color: #4a3b32; font-family: inherit;
      box-shadow: 0 2px 0 rgba(0,0,0,.18);
    }

    /* ---- 像素图标（src/ui/icons.js）：与 HUD 爱心/碎片同族 ----
       尺寸对齐所在行字号，由使用处上下文控制 */
    .pq-icon { display: inline-block; vertical-align: middle; }
    .map-title .pq-icon { width: 26px; height: 26px; margin-right: 6px; }
    .map-tip .pq-icon { width: 14px; height: 14px; margin-right: 3px; vertical-align: -2px; }
    .mn-badge .pq-icon { width: 13px; height: 13px; }
    #dlg-next .pq-icon { width: 14px; height: 7px; margin-right: 4px; vertical-align: -1px; }
    #objective .pq-icon { width: 15px; height: 15px; margin-right: 5px; vertical-align: -3px; }
    /* 章节金印（#13 胜利封印页）：定位 / 尺寸 / 盖印动画见底部胜利画面区块 */

    /* 暗角（氛围） */
    #vignette {
      position: absolute; inset: 0; pointer-events: none; z-index: 5;
      background: radial-gradient(ellipse at center, transparent 52%, rgba(24,16,38,.34) 100%);
    }

    /* 塞尔达式圆形转场 */
    #wipe {
      position: absolute; inset: 0; pointer-events: none; z-index: 60;
      background: #241c2e;
      clip-path: circle(0% at 50% 50%);
    }

    /* 对话框 */
    #dialogue {
      position: absolute; left: 50%; bottom: 46px; transform: translateX(-50%);
      width: min(680px, 92%);
      background: var(--panel);
      border: 3px solid var(--panel-border);
      border-radius: 14px;
      box-shadow: 0 6px 0 rgba(0,0,0,.25);
      padding: 14px 18px 12px;
      display: none;
    }
    #dialogue.show { display: block; animation: dlgRise .2s ease-out; }
    /* 三模态一致：quiz/map 已有 pop 入场，对话补 200ms 上浮淡入（一次性）
       keyframes 内保留 translateX(-50%)，避免覆盖水平居中 */
    @keyframes dlgRise {
      from { transform: translateX(-50%) translateY(14px); opacity: 0; }
      to { transform: translateX(-50%) translateY(0); opacity: 1; }
    }
    #dlg-name { color: #c2404a; font-size: var(--fs-body); margin-bottom: 4px; }
    #dlg-text { font-family: var(--font-kai); font-size: var(--fs-body-lg); line-height: 1.55; min-height: 52px; }
    #dlg-next { text-align: right; font-family: var(--font-kai); font-size: var(--fs-caption); color: #7a5f3c; animation: blink 1s infinite; }
    @keyframes blink { 50% { opacity: .25; } }

    /* 答题面板 */
    #quiz-backdrop {
      position: absolute; inset: 0;
      background: rgba(20, 14, 30, .55);
      display: none;
      align-items: center; justify-content: center;
    }
    #quiz-backdrop.show { display: flex; }
    #quiz {
      width: min(560px, 94%);
      background: var(--panel);
      border: 3px solid var(--panel-border);
      border-radius: 16px;
      box-shadow: 0 8px 0 rgba(0,0,0,.3);
      padding: 16px 18px;
      animation: pop .18s ease-out;
    }
    @keyframes pop { from { transform: scale(.92); opacity: 0; } }
    #quiz.shake { animation: shake .35s; }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20% { transform: translateX(-8px); } 40% { transform: translateX(8px); }
      60% { transform: translateX(-5px); } 80% { transform: translateX(5px); }
    }
    .quiz-chapter {
      display: inline-block; background: var(--teal); color: #083b3a;
      font-size: var(--fs-caption); border-radius: 8px; padding: 2px 10px; margin-bottom: 6px;
    }
    .quiz-chapter.boss { background: #d591ff; color: #4a2a66; }
    #quiz-prompt { font-family: var(--font-kai); font-size: var(--fs-body-lg); line-height: 1.5; margin-bottom: 10px; }
    .code-block {
      font-family: "JetBrains Mono", Consolas, "Courier New", monospace;
      font-size: 15px; line-height: 1.6;
      background: #2f2a3d; color: #e8e3f5;
      border-radius: 10px; padding: 10px 14px; margin-bottom: 12px;
      white-space: pre; overflow-x: auto;
    }
    .code-block .blank {
      display: inline-block; min-width: 52px; text-align: center;
      border-bottom: 2px dashed var(--gold); color: var(--gold);
      padding: 0 6px; cursor: default;
    }
    .code-block .kw { color: #ff9db8; }
    .code-block .fn { color: #8fd6ff; }
    .code-block .str { color: #b5e48c; }
    .code-block .num { color: #ffd257; }
    #quiz-options { display: flex; flex-direction: column; gap: 8px; }
    .opt {
      text-align: left; font-family: var(--font-kai);
      font-size: var(--fs-body-lg); color: var(--ink);
      background: #fff; border: 2px solid #d8c193;
      border-radius: 10px; padding: 9px 14px; cursor: pointer;
      transition: transform .06s, border-color .12s, background .12s;
    }
    .opt:hover { border-color: var(--panel-border); transform: translateX(3px); }
    .opt.selected { border-color: var(--teal); background: #e7fbfa; }
    .opt.right { border-color: var(--green); background: #e9f8e4; }
    .opt.wrong { border-color: var(--accent); background: #fdeaea; }
    .opt.right::after { content: '✓'; float: right; color: #2e7d32; font-weight: bold; animation: stampIn .28s ease-out; }
    .opt.wrong::after { content: '✗'; float: right; color: #c62828; font-weight: bold; animation: stampIn .28s ease-out; }
    @keyframes stampIn { from { transform: scale(2.2); opacity: 0; } }

    /* ---------- 答对兑付：「碎片入袋」（QuizOverlay._playShardFlight） ---------- */
    /* 兑付期间面板已隐形但暗层保留，先放行指针 */
    #quiz-backdrop.fading { transition: opacity .32s ease; opacity: 0; }
    /* 题面代码块徽记金光（约 120ms） */
    .code-block.blessed {
      animation: blessGlow 120ms ease-out;
    }
    @keyframes blessGlow {
      0% { box-shadow: none; }
      35% {
        box-shadow: 0 0 0 3px rgba(255, 210, 87, .75), 0 0 24px rgba(255, 210, 87, .55);
        border-color: var(--gold);
        background: #443a2c; /* 暗底轻染暖金 */
      }
      100% { box-shadow: none; }
    }
    /* 飞行碎片：复用 HUD 碎片 SVG，放大约 2 倍（34×41） */
    .shard-fly {
      position: absolute; left: 0; top: 0; z-index: 30;
      width: 34px; height: 41px;
      pointer-events: none;
      filter: drop-shadow(0 0 7px rgba(255, 210, 87, .7));
      will-change: transform, opacity;
    }
    .shard-fly svg { display: block; width: 34px; height: 41px; }
    /* 屏幕极轻金光脉冲：峰值 opacity .18、200ms（延迟与 QuizOverlay T.REVEAL-10ms 联动） */
    .shard-pulse {
      position: absolute; inset: 0; z-index: 50; pointer-events: none;
      background: radial-gradient(120% 110% at 82% 8%,
        rgba(255, 210, 87, .9) 0%, rgba(255, 210, 87, .35) 16%, rgba(255, 210, 87, 0) 44%);
      animation: shardPulse 200ms ease-out 940ms both;
    }
    @keyframes shardPulse {
      0% { opacity: 0; }
      40% { opacity: .18; }
      100% { opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .code-block.blessed, .shard-pulse, #dialogue.show { animation: none; }
    }

    .opt code, .fill-preview { font-family: "JetBrains Mono", Consolas, monospace; font-size: 14px; }
    /* ---- 答题反馈分层（#8）：首行结果（红/绿功能色），次行「提示/解析」内嵌条 ----
       提示是教学内容，独立成条：羊皮纸上略深一档的纸底 + 3px 左边线，文楷排版 */
    #quiz-feedback {
      font-family: var(--font-kai); font-size: var(--fs-body);
      line-height: 1.5; min-height: 22px; margin-top: 10px;
    }
    #quiz-feedback .fb-line { font-weight: 700; }
    #quiz-feedback.ok .fb-line { color: #2e7d32; }
    #quiz-feedback.bad .fb-line { color: #c62828; }
    #quiz-feedback .fb-hint {
      margin-top: 6px; padding: 7px 10px 8px 12px;
      border-left: 3px solid var(--panel-border);
      background: #f3e3c4;               /* 比羊皮纸深一档的暖纸底（同 #map-path 用色） */
      border-radius: 0 8px 8px 0;
      color: var(--ink);
    }
    #quiz-feedback.ok .fb-hint {
      border-left-color: var(--green);
      background: #e9f8e4;               /* 答对：绿系（同 .opt.right 用色） */
    }
    #quiz-feedback .fb-hint-label {
      font-weight: 700; color: #7a5f3c;
      letter-spacing: 2px; margin-right: 8px;
    }
    #quiz-feedback.ok .fb-hint-label { color: #2e7d32; }
    #quiz-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 12px; }
    .btn {
      font-family: inherit; font-size: var(--fs-body); cursor: pointer;
      border: 2px solid var(--panel-border); border-radius: 10px;
      padding: 7px 18px; background: #fff; color: var(--ink);
      box-shadow: 0 3px 0 rgba(0,0,0,.15);
      transition: transform .06s;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn:active { transform: translateY(1px); box-shadow: none; }
    .btn.primary { background: var(--green); border-color: #3d8f3d; color: #fff; }
    .btn.ghost { background: transparent; border-color: rgba(255,255,255,.4); color: #d8d2ea; box-shadow: none; }
    .btn:disabled { opacity: .45; cursor: not-allowed; }

    /* ================= 世界地图（Tab 呼出） =================
       一张羊皮纸大地图：八章地形色块 + landmark 小图标 + 弯曲小径。
       地标三态：done 已通关 = 亮金 / 可进入 = 深紫 / locked = 墨紫。 */
    #map-backdrop {
      position: absolute; inset: 0;
      background:
        radial-gradient(120% 80% at 50% 42%, rgba(46, 32, 54, .55), rgba(18, 12, 26, .78));
      display: none; align-items: center; justify-content: center;
      z-index: 40;
    }
    #map-backdrop.show { display: flex; }
    #worldmap {
      width: min(880px, 94%);
      background: linear-gradient(180deg, #fff9ec 0%, #f7ebd3 100%);
      border: 3px solid var(--panel-border);
      border-radius: 18px;
      box-shadow:
        0 9px 0 rgba(0, 0, 0, .28),
        0 26px 50px rgba(0, 0, 0, .42),
        inset 0 1px 0 #fffdf6;
      padding: 10px 12px 8px;
      animation: pop .18s ease-out;
    }
    .map-head {
      display: flex; justify-content: space-between; align-items: center;
      gap: 10px; margin: 2px 4px 8px;
    }
    .map-title {
      font-size: var(--fs-display); color: #4a3323; letter-spacing: 3px;
      text-shadow: 0 1px 0 #fffdf6;
    }
    .map-sub { font-family: var(--font-kai); font-size: var(--fs-caption); color: #9a7f5a; text-align: right; line-height: 1.5; }
    .map-sub b { color: #bf8a26; }
    /* 分隔符：用间距替代「·」拼接（map-sub 用；#13 起胜利统计改为印章组，不再使用） */
    .dot-sep { margin: 0 10px; }

    /* ---- 画布：SVG 美术 + 按比例缩放的地标层 ---- */
    #map-path {
      position: relative;
      aspect-ratio: 1000 / 600;
      border-radius: 12px;
      overflow: hidden;
      background: #f3e3c4;
      box-shadow:
        inset 0 0 0 2px #dcc59c,
        inset 0 4px 18px rgba(120, 85, 40, .18);
      --map-scale: 1;
    }
    .map-art {
      position: absolute; inset: 0;
      width: 100%; height: 100%; display: block;
      user-select: none; pointer-events: none;
    }
    .route-layer {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      pointer-events: none;
    }
    .map-nodes {
      position: absolute; top: 0; left: 0;
      width: 1000px; height: 600px;
      transform: scale(var(--map-scale));
      transform-origin: 0 0;
      pointer-events: none;
    }

    /* ---- 小径：已通关 = 金色实线；可进入 = 流动金色点线；未解锁 = 暗色虚线 ---- */
    .route-casing { fill: none; stroke: #f6e8cb; stroke-width: 8.5; stroke-linecap: round; }
    .route { fill: none; stroke-width: 3.8; stroke-linecap: round; }
    .route--done {
      stroke: #e0a53c;
      filter: drop-shadow(0 0 2.5px rgba(224, 165, 60, .55));
    }
    .route--open {
      stroke: #dfa437;
      stroke-dasharray: 1 9;
      filter: drop-shadow(0 0 2px rgba(224, 165, 60, .5));
    }
    .route--lock {
      stroke: #9c8666;
      stroke-dasharray: 5 8;
      opacity: .55;
    }

    /* ---- 地标（0 尺寸锚点 + 圆徽 + 名称牌） ---- */
    .map-node {
      position: absolute;
      left: calc(var(--x) * 10px);
      top: calc(var(--y) * 6px);
      /* 134×110 的命中区：锚点 = 圆徽中心（上探 23px，名称牌向下展开） */
      width: 142px; height: 116px;
      margin: -23px 0 0 -71px;
      padding: 0; border: 0; background: none;
      font-family: inherit;
      color: inherit;
      text-align: left;
      cursor: pointer;
      pointer-events: auto;
      z-index: 2;
      -webkit-tap-highlight-color: transparent;
    }
    .map-node:hover:not(.locked),
    .map-node:focus-visible { z-index: 5; }
    .map-node.here { z-index: 4; }

    .mn-pin {
      position: absolute; left: 50%; top: 23px;
      width: 48px; height: 48px;
      transform: translate(-50%, -50%);
      display: grid; place-items: center;
      transition: transform .18s cubic-bezier(.34, 1.56, .64, 1);
    }
    .mn-disc {
      width: 44px; height: 44px; border-radius: 50%;
      display: grid; place-items: center;
      font-size: var(--fs-body-lg); line-height: 1;
      font-variant-numeric: tabular-nums;
      color: #f6ecdd;
      background: radial-gradient(circle at 34% 26%, #584568 0%, #3a2d46 62%, #2b2135 100%);
      border: 3px solid #7a5f8b;
      box-shadow:
        inset 0 2px 0 rgba(255, 255, 255, .16),
        0 3px 0 rgba(0, 0, 0, .3),
        0 0 0 3px rgba(255, 249, 233, .6);
      text-shadow: 0 1px 2px rgba(0, 0, 0, .45);
      transition: box-shadow .18s ease, background .18s ease;
    }
    .mn-badge {
      position: absolute; top: -2px; right: -1px;
      width: 21px; height: 21px; border-radius: 50%;
      display: grid; place-items: center;
      font-size: var(--fs-caption); line-height: 1;
      background: #fff8ea; border: 2px solid #b98a4e;
      box-shadow: 0 2px 4px rgba(0, 0, 0, .28);
    }
    .mn-badge:empty { display: none; }

    .mn-plate {
      position: absolute; left: 50%; top: 50px;
      transform: translateX(-50%);
      width: 142px;
      display: flex; flex-direction: column; align-items: flex-start; gap: 1px;
      padding: 5px 9px 6px;
      border-radius: 9px;
      text-align: left;
      background: rgba(40, 31, 49, .94);
      border: 1.5px solid #6a5478;
      box-shadow:
        0 4px 10px rgba(0, 0, 0, .32),
        inset 0 1px 0 rgba(255, 255, 255, .08);
      transition: transform .18s cubic-bezier(.34, 1.56, .64, 1),
                  background .15s ease, border-color .15s ease, box-shadow .15s ease;
    }
    .mn-week {
      display: flex; justify-content: space-between; align-items: baseline;
      gap: 6px; width: 100%;
      font-size: var(--fs-caption); letter-spacing: 1.2px; color: #c8ac89;
    }
    .mn-here-tag { color: #ffd257; letter-spacing: .5px; }
    .mn-name {
      font-size: var(--fs-body); line-height: 1.3; color: #f8efe0;
      white-space: nowrap;
      text-shadow: 0 1px 2px rgba(0, 0, 0, .4);
    }
    .mn-status {
      margin-top: 1px;
      font-size: var(--fs-caption); line-height: 1.55;
      color: #e9d7bd;
      background: rgba(255, 255, 255, .1);
      border: 1px solid rgba(255, 214, 140, .18);
      border-radius: 5px;
      padding: 0 5px;
      white-space: nowrap;
    }

    /* ---- hover / 按下：轻微上浮 + 光晕 ---- */
    .map-node:hover:not(.locked) .mn-pin {
      transform: translate(-50%, calc(-50% - 5px));
      filter: drop-shadow(0 0 9px rgba(255, 210, 87, .5));
    }
    .map-node:hover:not(.locked) .mn-plate {
      transform: translate(-50%, -4px);
      background: rgba(54, 42, 66, .97);
      border-color: #b98a4e;
      box-shadow:
        0 9px 18px rgba(0, 0, 0, .4),
        0 0 0 1px rgba(255, 210, 87, .25);
    }
    .map-node:hover:not(.locked) .mn-disc {
      box-shadow:
        inset 0 2px 0 rgba(255, 255, 255, .22),
        0 6px 12px rgba(0, 0, 0, .35),
        0 0 0 3px rgba(255, 249, 233, .75),
        0 0 20px rgba(255, 210, 87, .6);
    }
    .map-node:active:not(.locked) .mn-pin {
      transform: translate(-50%, calc(-50% - 1px)) scale(.97);
    }

    /* ---- done：已通关，暖金圆徽 + 亮纸牌 + 静态柔光 ---- */
    .map-node.done .mn-disc {
      color: #5b3a05;
      background: radial-gradient(circle at 34% 26%, #fffbe0 0%, #ffdd82 48%, #f2b43c 100%);
      border-color: #a8701a;
      text-shadow: 0 1px 0 rgba(255, 255, 255, .6);
      box-shadow:
        inset 0 2px 0 rgba(255, 255, 255, .92),
        0 3px 0 rgba(139, 90, 0, .35),
        0 0 0 3px rgba(255, 249, 226, .92),
        0 0 20px rgba(255, 196, 72, .6);
    }
    .map-node.done .mn-badge {
      background: #fffdf6; border-color: #2f7d33; color: #2f7d33;
    }
    .map-node.done .mn-plate {
      background: linear-gradient(180deg, #fffaea 0%, #ffe5a0 100%);
      border-color: #d9a03a;
      box-shadow:
        0 4px 12px rgba(160, 105, 20, .28),
        inset 0 1px 0 #fff,
        0 0 0 1px rgba(255, 210, 87, .45);
    }
    .map-node.done .mn-week { color: #7a5a28; }
    .map-node.done .mn-here-tag { color: #8a5a00; }
    .map-node.done .mn-name { color: #3f2c1c; text-shadow: none; }
    .map-node.done .mn-status {
      color: #2a6f2f;
      background: rgba(46, 125, 50, .12);
      border-color: rgba(46, 125, 50, .24);
    }
    .map-node.done:hover .mn-plate {
      background: linear-gradient(180deg, #fffdf4 0%, #ffefbc 100%);
      box-shadow:
        0 9px 20px rgba(160, 105, 20, .3),
        inset 0 1px 0 #fff,
        0 0 22px rgba(255, 196, 72, .45);
    }

    /* ---- locked：未解锁，最暗最钝，锁仍可辨 ---- */
    .map-node.locked { cursor: not-allowed; }
    .map-node.locked .mn-disc {
      color: #8c8098;
      background: radial-gradient(circle at 34% 26%, #2c2436 0%, #221c2a 65%, #1b1622 100%);
      border-color: #3d3446;
      box-shadow:
        inset 0 2px 0 rgba(255, 255, 255, .05),
        0 2px 0 rgba(0, 0, 0, .3),
        0 0 0 3px rgba(255, 249, 233, .38);
      text-shadow: none;
    }
    .map-node.locked .mn-badge {
      background: #efe5d3; border-color: #4a3f55; opacity: .9;
    }
    .map-node.locked .mn-plate {
      background: rgba(27, 21, 34, .94);
      border-color: #3d3446;
      box-shadow: 0 3px 8px rgba(0, 0, 0, .35), inset 0 1px 0 rgba(255, 255, 255, .04);
    }
    .map-node.locked .mn-week { color: #a89bb3; }
    .map-node.locked .mn-name { color: #b0a5bb; text-shadow: none; }
    .map-node.locked .mn-status {
      color: #a89bb3;
      background: rgba(255, 255, 255, .05);
      border-color: rgba(255, 255, 255, .08);
    }
    /* ---- here：当前所在章：常驻金环 + 扩散脉冲（暗底/亮底都清晰） ---- */
    .map-node.here .mn-pin::before {
      content: '';
      position: absolute; inset: -3px;
      border-radius: 50%;
      border: 2.5px solid var(--gold);
      box-shadow: 0 0 10px rgba(255, 210, 87, .6);
      pointer-events: none;
    }
    .map-node.here .mn-pin::after {
      content: '';
      position: absolute; inset: -4px;
      border-radius: 50%;
      border: 2.5px solid var(--gold);
      animation: herePulse 2.4s ease-out infinite;
      pointer-events: none;
    }
    .map-node.here .mn-plate {
      border-color: #e9b247;
      box-shadow:
        0 4px 12px rgba(0, 0, 0, .32),
        0 0 0 1.5px rgba(255, 210, 87, .65);
    }
    @keyframes herePulse {
      0% { transform: scale(.9); opacity: .95; }
      70% { transform: scale(1.4); opacity: 0; }
      100% { transform: scale(1.4); opacity: 0; }
    }

    /* ---- 键盘焦点 ---- */
    .map-node:focus-visible { outline: none; }
    .map-node:focus-visible .mn-plate {
      outline: 3px solid var(--gold);
      outline-offset: 3px;
    }
    .map-node.locked:focus-visible .mn-plate { outline-color: #7b6a89; }

    /* ---- 图例 ---- */
    .map-foot {
      display: flex; flex-wrap: wrap; align-items: center;
      gap: 4px 14px;
      margin-top: 8px; padding: 0 4px 2px;
      font-family: var(--font-kai);
      font-size: var(--fs-caption); color: #8c7350;
    }
    .lg { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
    .lg::before {
      content: ''; width: 20px; height: 0;
      border-top: 3px solid #e0a53c; border-radius: 2px;
    }
    .lg-open::before { border-top-style: dotted; }
    .lg-lock::before { border-top-style: dashed; border-top-color: #a08a6c; opacity: .7; }
    .map-tip { margin-left: auto; color: #9a7f5a; }

    /* ---- 竖屏断点（#12 移动端断裂修复）----
       旧 @media(max-width:680px) 视口断点已删除：布局住在按高度压缩的 stage 里，
       视口宽度不再反映布局宽度，媒体查询救不了断裂。改由 main.js 依据
       aspect（innerHeight > innerWidth）在 body 挂 .portrait，以下规则全部
       写在 #ui-scale 的 960×640 设计坐标系内。
       竖屏时 main.js 还会把设计画布向上下扩展铺满整块视口（--cam-pad =
       画布区域外的设计边距）：全屏浮层（quiz / 地图 / 标题 / 胜利）占满屏幕；
       HUD / 提示 / 对话通过 --cam-pad 仍锚定画布边缘，与游戏画面对齐。
       字号统一放大约 1.6~1.8 倍：竖屏下整体缩放系数仅约 0.39，
       设计 15px 只有 6px 视觉高度，不放大则不可读。 */
    .portrait #hud-top { top: calc(10px + var(--cam-pad)); }
    .portrait #hint { bottom: calc(12px + var(--cam-pad)); font-size: 26px; }
    .portrait #dialogue { bottom: calc(46px + var(--cam-pad)); width: min(860px, 96%); }
    .portrait #vignette { top: var(--cam-pad); bottom: var(--cam-pad); }

    /* HUD / 对话：字号放大，锚定关系不变 */
    .portrait .hearts svg { width: 42px; height: 42px; }
    .portrait .hud-right { font-size: 26px; border-width: 3px; border-radius: 16px; padding: 8px 16px; }
    .portrait .hud-right svg { width: 24px; height: 30px; }
    .portrait #objective { font-size: 26px; padding: 4px 14px; }
    .portrait #objective .pq-icon { width: 24px; height: 24px; }
    .portrait #dlg-name { font-size: 24px; }
    .portrait #dlg-text { font-size: 30px; min-height: 92px; }
    .portrait #dlg-next { font-size: 18px; }
    .portrait kbd { min-width: 26px; line-height: 26px; font-size: 18px; padding: 0 8px; }

    /* 答题面板：全宽 + 放大（在全屏设计画布中居中；内容超高时滚动） */
    .portrait #quiz-backdrop { overflow-y: auto; }
    .portrait #quiz { width: 92%; margin: auto; }
    .portrait .quiz-chapter { font-size: 18px; padding: 3px 14px; }
    .portrait #quiz-prompt { font-size: 34px; }
    .portrait .code-block { font-size: 24px; padding: 14px 18px; }
    .portrait .code-block .blank { min-width: 72px; }
    .portrait .opt { font-size: 30px; padding: 14px 20px; }
    .portrait .opt code, .portrait .fill-preview { font-size: 24px; }
    .portrait #quiz-feedback { font-size: 24px; }
    .portrait .btn { font-size: 24px; padding: 10px 26px; }

    /* 标题 / 胜利：全屏竖排，主标题维持视觉冲击 */
    .portrait #title h1 { font-size: 84px; }
    .portrait #title .subtitle { font-size: 30px; letter-spacing: 2px; }
    .portrait #title .keys { font-size: 24px; line-height: 1.9; max-width: 94%; }
    .portrait #btn-start { font-size: 30px; padding: 16px 52px; }

    /* 胜利封印页（#13）：全屏竖排，金印与三枚统计印同步放大，终章仪式感不减 */
    .portrait #victory .seal-paper {
      width: 100%; max-width: none; height: 100%;
      border-radius: 0; border-width: 0;
      display: flex; flex-direction: column; justify-content: center;
      padding: 0 30px 30px;
      animation: none;
    }
    .portrait #victory .seal-band { margin: 0 -30px 30px; padding: 22px 120px 19px; border-radius: 0; }
    .portrait #victory h1 { font-size: 64px; }
    .portrait #victory .victory-stamp { width: 106px; height: 106px; top: 20px; right: 28px; }
    .portrait #victory .victory-stamp .pq-icon { width: 106px; height: 106px; }
    .portrait #victory .seal-sub { font-size: 28px; line-height: 1.65; margin: 0 8px 32px; }
    .portrait #victory .stat-seal { width: 182px; padding: 18px 8px 15px; gap: 6px; border-radius: 18px; }
    .portrait #victory .stat-seal .pq-icon { width: 30px; height: 36px; }
    .portrait #victory .stat-num { font-size: 38px; }
    .portrait #victory .stat-lbl { font-size: 20px; }
    .portrait #victory .seal-actions { flex-wrap: wrap; }
    .portrait #victory .btn { font-size: 26px; padding: 12px 32px; }

    /* 世界地图：全屏滚动章节列表（两列卡在窄高比下重排为单列） */
    .portrait #worldmap {
      width: 100%; height: 100%;
      border-radius: 0;
      display: flex; flex-direction: column;
      padding: 14px 16px 10px;
    }
    .portrait .map-head { margin: 0 0 10px; }
    .portrait .map-title { font-size: 34px; letter-spacing: 2px; }
    .portrait .map-title .pq-icon { width: 34px; height: 34px; }
    .portrait .map-sub { font-size: 18px; text-align: left; }
    .portrait #map-path {
      aspect-ratio: auto; flex: 1; min-height: 0;
      overflow-y: auto;
      background: none; box-shadow: none; border-radius: 0;
    }
    .portrait .map-art, .portrait .route-layer { display: none; }
    .portrait #map-path .map-nodes {
      position: static; width: auto; height: auto; transform: none;
      display: flex; flex-direction: column; gap: 12px;
    }
    .portrait #map-path .map-node {
      position: static; width: auto; height: auto; margin: 0;
      display: flex; align-items: center; gap: 16px;
      padding: 12px 16px; border-radius: 14px;
      background: linear-gradient(158deg, #3d3046 0%, #2f2539 100%);
      border: 2px solid #6a5478;
      box-shadow: 0 2px 0 rgba(0, 0, 0, .25), inset 0 1px 0 rgba(255, 255, 255, .1);
    }
    .portrait #map-path .mn-pin {
      position: relative; left: auto; top: auto; transform: none;
      width: 56px; height: 56px; flex: 0 0 56px;
    }
    .portrait #map-path .mn-disc { width: 52px; height: 52px; font-size: 26px; box-shadow: none; }
    .portrait #map-path .mn-badge { width: 24px; height: 24px; font-size: 13px; top: -4px; right: -4px; }
    .portrait #map-path .mn-plate {
      position: static; transform: none; width: auto;
      padding: 0; background: none; border: 0; box-shadow: none;
      gap: 2px;
    }
    .portrait #map-path .mn-week { font-size: 18px; letter-spacing: 1px; }
    .portrait #map-path .mn-name { font-size: 28px; white-space: normal; }
    .portrait #map-path .mn-status { font-size: 20px; margin-top: 2px; }
    .portrait #map-path .map-node.done {
      background: linear-gradient(158deg, #fffaea 0%, #ffe6a2 100%);
      border-color: #d9a03a;
    }
    .portrait #map-path .map-node.locked {
      background: linear-gradient(158deg, #2a2333 0%, #211b29 100%);
      border-color: #40364a;
    }
    .portrait #map-path .map-node.here:not(.locked) {
      box-shadow: 0 0 0 2px #2b2233, 0 0 0 4px var(--gold);
    }
    .portrait #map-path .map-node:hover:not(.locked) .mn-pin { transform: none; }
    .portrait #map-path .map-node:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
    .portrait #map-path .map-node:focus-visible .mn-plate { outline: none; }
    .portrait .map-foot { font-size: 16px; margin-top: 10px; }
    .portrait .map-tip { margin-left: 0; }

    @media (prefers-reduced-motion: reduce) {
      .map-node.here .mn-pin::after,
      #worldmap { animation: none; }
    }

    /* 标题画面 / 胜利画面 */
    .full-modal {
      position: absolute; inset: 0;
      background: linear-gradient(180deg, #2c2438 0%, #3a2d52 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 14px; text-align: center; color: #fff;
      overflow: hidden;
    }
    .full-modal .stars {
      position: absolute; inset: 0; pointer-events: none;
      background-image:
        radial-gradient(circle, rgba(255,210,87,.5) 1.5px, transparent 2px),
        radial-gradient(circle, rgba(255,255,255,.4) 1px, transparent 1.5px),
        radial-gradient(circle, rgba(125,218,255,.45) 1.5px, transparent 2px);
      background-size: 190px 170px, 120px 140px, 260px 210px;
      background-position: 0 0, 40px 60px, 80px 20px;
      animation: starDrift 60s linear infinite;
      opacity: .8;
    }
    @keyframes starDrift {
      from { background-position: 0 0, 40px 60px, 80px 20px; }
      to { background-position: 190px 340px, 160px 280px, 340px 420px; }
    }
    .full-modal.hidden { display: none; }
    #title h1 {
      font-size: var(--fs-logo); color: var(--gold);
      text-shadow: 0 4px 0 #8a5a00, 0 8px 18px rgba(0,0,0,.5);
      letter-spacing: 10px;
      padding-left: 10px; /* 抵消末字符的 letter-spacing，保持视觉居中 */
    }
    #title .subtitle { font-size: var(--fs-display); color: #cfd6ff; letter-spacing: 3px; }
    #title .keys {
      margin-top: 10px; font-size: var(--fs-body); color: #b9c0e8; line-height: 2;
      background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.15);
      border-radius: 12px; padding: 10px 26px;
    }
    #title .keys b { color: var(--gold); }
    #btn-start {
      margin-top: 18px; font-size: var(--fs-display); letter-spacing: 4px;
      padding: 12px 46px; border-radius: 14px;
      background: var(--accent); border-color: #a83d3d; color: #fff;
      box-shadow: 0 5px 0 #7d2b2b;
    }
    /* ---- 胜利画面 · 章节封印页（#13）：与标题星空模板彻底脱钩 ----
       一张羊皮纸「通关证书」浮在暗色暖光里：暮紫窄条压顶承载金字标题，
       章节金印盖在条与纸的交界，三枚统计印并排取代 dot-sep 数据行。
       盖印时间轴：纸面 0~0.3s 上浮 → 金印 0.26~0.72s 落印（back-out 回弹）
       → 0.58s 纸面顿挫 + 0.6s 墨圈晕开 → 统计印 0.85/1.0/1.15s 依次盖下
       → 1.32s 按钮区收尾浮现（prefers-reduced-motion 时全部静态呈现） */
    #victory {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: radial-gradient(120% 90% at 50% 38%, rgba(66, 46, 30, .58), rgba(22, 14, 9, .85));
      overflow: hidden;
    }
    #victory.hidden { display: none; }
    .seal-paper {
      position: relative;
      width: 680px; max-width: 94%;
      background: linear-gradient(180deg, #fff9ec 0%, #f7ebd3 100%);
      border: 2px solid var(--panel-border);
      border-radius: var(--r-lg);
      box-shadow:
        0 9px 0 rgba(0, 0, 0, .28),
        0 26px 50px rgba(0, 0, 0, .42),
        inset 0 1px 0 #fffdf6;
      padding: 0 36px 32px;
      text-align: center;
      animation: paperRise .3s ease-out both, paperThud .22s ease-out .58s;
    }
    /* 证书式内侧虚线框 */
    .seal-paper::before {
      content: ''; position: absolute; inset: 9px;
      border: 2px dashed rgba(185, 138, 78, .38);
      border-radius: 13px;
      pointer-events: none;
    }
    @keyframes paperRise { from { transform: translateY(18px) scale(.97); opacity: 0; } }
    @keyframes paperThud {
      0% { transform: translateY(0); }
      45% { transform: translateY(3px); }
      100% { transform: translateY(0); }
    }
    /* 暮紫深底窄条压顶：保留一丝「夜战告捷」的色温，与标题屏的星空渐变分道 */
    .seal-band {
      margin: 0 -36px 24px;
      padding: 20px 104px 17px;
      background: linear-gradient(180deg, #57427a 0%, #4d3b68 100%);
      border-bottom: 3px solid var(--panel-border);
      border-radius: 16px 16px 0 0;
    }
    #victory h1 {
      font-size: var(--fs-hero); color: var(--gold);
      text-shadow: 0 3px 0 #8a5a00, 0 7px 16px rgba(0, 0, 0, .5);
      letter-spacing: 4px; padding-left: 4px;
    }
    .seal-sub {
      font-family: var(--font-kai); font-size: var(--fs-body-lg);
      color: var(--ink); line-height: 1.75; margin: 0 26px 24px;
    }
    /* 章节金印：骑在暮紫条与纸面交界处微倾 9°，落印 scale 回弹出「顿挫」 */
    .victory-stamp {
      position: absolute; top: 15px; right: 25px;
      width: 74px; height: 74px;
      filter: drop-shadow(0 4px 0 rgba(0, 0, 0, .32));
      animation: sealDrop .46s cubic-bezier(.34, 1.56, .64, 1) .26s both;
    }
    .victory-stamp .pq-icon { width: 74px; height: 74px; }
    .victory-stamp::after {
      content: ''; position: absolute; inset: -7px;
      border-radius: 50%;
      border: 3px solid rgba(185, 138, 78, .55);
      animation: sealRing .5s ease-out .6s both;
    }
    @keyframes sealDrop {
      0% { transform: rotate(-9deg) scale(2.6); opacity: 0; }
      55% { opacity: 1; }
      100% { transform: rotate(-9deg) scale(1); opacity: 1; }
    }
    @keyframes sealRing {
      0% { transform: scale(.55); opacity: 0; }
      35% { opacity: .9; }
      100% { transform: scale(1.55); opacity: 0; }
    }
    /* 三枚统计印：像素风小圆章（图标 + 数字 + 小标），取代 teal 数据行 */
    .seal-stats { display: flex; justify-content: center; gap: 28px; margin: 2px 0 26px; }
    .stat-seal {
      width: 122px; padding: 13px 6px 11px;
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      background: #fffdf6;
      border: 2px solid var(--panel-border);
      border-radius: 15px;
      box-shadow:
        inset 0 0 0 3px rgba(185, 138, 78, .28),
        0 3px 0 rgba(0, 0, 0, .16);
      animation: stampIn .3s ease-out both;
    }
    .stat-seal:nth-child(1) { animation-delay: .85s; }
    .stat-seal:nth-child(2) { animation-delay: 1s; }
    .stat-seal:nth-child(3) { animation-delay: 1.15s; }
    .stat-seal .pq-icon { width: 20px; height: 24px; }
    .stat-num {
      font-family: "JetBrains Mono", Consolas, monospace;
      font-size: 24px; font-weight: 700; line-height: 1.15;
      color: #6b4a1e; font-variant-numeric: tabular-nums;
    }
    .stat-lbl {
      font-family: var(--font-kai); font-size: var(--fs-caption);
      color: #9a7f5a; letter-spacing: 2.5px; padding-left: 2.5px;
    }
    .seal-actions {
      display: flex; justify-content: center; gap: 16px;
      animation: sealUp .3s ease-out 1.32s both;
    }
    @keyframes sealUp { from { transform: translateY(9px); opacity: 0; } }
    /* 「放弃冒险」：.btn.ghost 原为星空底设计的透明白，羊皮纸上改为纸面次级样式 */
    #victory .btn.ghost {
      background: #fff; border-color: var(--panel-border);
      color: var(--ink); box-shadow: 0 3px 0 rgba(0, 0, 0, .15);
    }
    @media (prefers-reduced-motion: reduce) {
      .seal-paper, .victory-stamp, .victory-stamp::after,
      .stat-seal, .seal-actions { animation: none; }
    }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="stage">
      <div id="game"></div>
      <div id="ui">
        <div id="ui-scale">
        <div id="vignette"></div>
        <div id="wipe"></div>
        <div id="hud-top" style="display:none">
          <div class="hearts" id="hearts"></div>
          <div class="hud-stack">
            <div class="hud-right">
              <span id="shard-count"></span>
            </div>
            <div id="objective"></div>
          </div>
        </div>
        <div id="hint" class="hidden"></div>

        <div id="dialogue">
          <div id="dlg-name"></div>
          <div id="dlg-text"></div>
          <div id="dlg-next">按 E / 点击 继续</div>
        </div>

        <div id="quiz-backdrop">
          <div id="quiz">
            <span class="quiz-chapter" id="quiz-chapter"></span>
            <div id="quiz-prompt"></div>
            <div class="code-block" id="quiz-code"></div>
            <div id="quiz-options"></div>
            <div id="quiz-feedback"></div>
            <div id="quiz-actions">
              <button class="btn" id="quiz-cancel">先不回答</button>
              <button class="btn primary" id="quiz-confirm" disabled>确认</button>
            </div>
          </div>
        </div>

        <div id="map-backdrop">
          <div id="worldmap">
            <div class="map-head">
              <span class="map-title">冒险地图</span>
              <span class="map-sub" id="map-sub"></span>
            </div>
            <div id="map-path"></div>
            <div class="map-foot">
              <span class="lg lg-done">已通关</span>
              <span class="lg lg-open">可进入</span>
              <span class="lg lg-lock">未解锁</span>
              <span class="map-tip">点击点亮的地标快速传送（通关前一章即解锁）</span>
            </div>
          </div>
        </div>

        <div id="title" class="full-modal">
          <div class="stars"></div>
          <h1>PyQuest</h1>
          <div class="subtitle">NLI 素材预览 · 静态姿态</div>
          <div class="keys">
            <kbd>方向键</kbd> / <kbd>WASD</kbd> 移动 &nbsp;·&nbsp; <kbd>J</kbd> / <kbd>空格</kbd> 挥剑 &nbsp;·&nbsp; <kbd>E</kbd> 交互 / 对话 &nbsp;·&nbsp; <kbd>Tab</kbd> 世界地图<br />
            八章关卡对应八周课程：基础 → 函数 → NumPy → 天文包 → 加速 → 数值方法 → 信号 → 暗物质晕！
          </div>
          <button class="btn primary" id="btn-start">开始冒险</button>
          <button class="btn ghost" id="btn-new" style="display:none">新的冒险</button>
        </div>

        <!-- 胜利画面 · 章节封印页（#13）：羊皮纸证书 + 盖章仪式（金印由 modal.js 注入） -->
        <div id="victory" class="hidden">
          <div class="seal-paper">
            <div class="seal-band">
              <h1 id="victory-title">冒险成功！</h1>
            </div>
            <div class="victory-stamp" aria-hidden="true"></div>
            <p class="seal-sub" id="victory-text">…</p>
            <div class="seal-stats" id="victory-stats"></div>
            <div class="seal-actions">
              <button class="btn primary" id="btn-next">▶ 进入第二章</button>
              <button class="btn ghost" id="btn-restart">放弃冒险，重头再来</button>
            </div>
          </div>
        </div>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
