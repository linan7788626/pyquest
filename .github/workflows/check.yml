name: PyQuest checks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
  full-game:
    if: github.event_name == 'workflow_dispatch'
    # Runner label kept for the Python scientific environment needed by
    # scripts/verify-quiz.mjs; no private art sources are required anymore:
    # check:release (test / verify-quiz / build / check-build / test:e2e)
    # consumes the tracked public/nli-preview runtime.
    runs-on: [self-hosted, pyquest-assets]
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run check:release
